# ============================================================
# Weekly rebuild so the Google rating baked into the static HTML
# (JSON-LD aggregateRating + meta descriptions) stays current.
#
# Visitors already get live numbers from the in-browser fetch in
# src/services/googleReviews.js — this is only about what crawlers
# see in the raw HTML, which is why once a week is plenty.
#
# Setup: add a repository secret named DEPLOY_HOOK_URL containing
# your host's build hook:
#   Vercel   Settings → Git → Deploy Hooks → create → copy URL
#   Netlify  Site settings → Build & deploy → Build hooks → add
#   Cloudflare Pages  Settings → Builds → Deploy hooks
#
# The rebuild runs `npm run build`, whose first step is
# `sync:reviews`, so the snapshot refreshes from Google on the host
# (where GOOGLE_MAPS_API_KEY and GOOGLE_PLACE_ID are configured).
# ============================================================

name: Refresh Google reviews

on:
  schedule:
    # 04:30 UTC every Monday = 10:00 IST.
    - cron: '30 4 * * 1'
  # Lets you trigger it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a production rebuild
        run: |
          if [ -z "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "DEPLOY_HOOK_URL secret is not set — nothing to trigger."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
          echo "Rebuild triggered."
